# ================================================================
# Abeeway Battery Estimator — Hardware Measurements File
# ================================================================
# Load this file in the estimator UI to override the built-in
# chipset constants without modifying any source code.
#
# Format  :  key = value
# Units   :  all currents in mA, all durations in seconds, voltage in V
# Comments:  lines starting with '#' are ignored
# ================================================================

# ── Supply voltage ───────────────────────────────────────────────
supply_voltage              = 3.6

# ── MCU & System ─────────────────────────────────────────────────
mcu_active_current_ma       = 0.300
quiescent_current_ma        = 0.001
accelerometer_current_ma    = 0.0065

# ── LoRa radio (SX1262) ──────────────────────────────────────────
lora_rx_current_ma          = 10
lora_tx_14dbm_current_ma    = 45
lora_tx_17dbm_current_ma    = 75
lora_tx_19dbm_current_ma    = 85

# ── GNSS / GPS chipset ───────────────────────────────────────────
gnss_active_current_ma      = 30     # standalone GNSS fix (30 mA measured)
gps_active_current_ma       = 22     # AGPS assisted mode
gps_standby_current_ma      = 0.05

# ── Monitoring wakeup ────────────────────────────────────────────
monitoring_current_ma       = 5
monitoring_window_ms        = 10

# ── WiFi chipset ─────────────────────────────────────────────────
wifi_scan_current_ma        = 11.6
wifi_scan_duration_s        = 9

# ── BLE chipset — geolocation scan ───────────────────────────────
# Current measured at 10.12 mA; duration is a fallback default —
# profile-based estimation uses per-scan durations from the device config
# (ble_scan1_duration / ble_scan2_duration, in ms).
ble_scan_current_ma         = 10.12
ble_scan_duration_s         = 3

# ── BLE chipset — custom BLE operations ──────────────────────────
ble_fast_adv_current_ma     = 10
ble_fast_adv_duration_s     = 2
ble_slow_adv_current_ma     = 3.5
ble_slow_adv_duration_s     = 10
ble_connected_current_ma    = 3.6
ble_connected_duration_s    = 2
ble_fast_scan_current_ma    = 2
ble_fast_scan_duration_s    = 8
ble_slow_scan_current_ma    = 0.5
ble_slow_scan_duration_s    = 30

# ── Cellular — LTE-M ─────────────────────────────────────────────
ltem_tx_current_ma          = 200
ltem_rx_current_ma          = 7
ltem_idle_current_ma        = 3

# ── Cellular — NB-IoT ────────────────────────────────────────────
nbiot_tx_current_ma         = 220
nbiot_rx_current_ma         = 5
nbiot_idle_current_ma       = 2.5
